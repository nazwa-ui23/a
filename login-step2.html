<div id="auth-step-2" class="auth-overlay">
    <div class="auth-card">
        <h2>Lengkapi Profil</h2>
        <p>Masukkan nama pengguna dan kata sandi kamu</p>
        <form onsubmit="handleAuthStep2(event)">
            <div class="form-group">
                <label for="input-username">Nama Pengguna (Username)</label>
                <input type="text" id="input-username" class="form-input" placeholder="Masukkan nama kamu" required>
            </div>
            <div class="form-group">
                <label for="input-password">Kata Sandi</label>
                <input type="password" id="input-password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-auth">Lanjut <i class="fas fa-arrow-right"></i></button>
        </form>
    </div>
</div>
