<div id="role-selection-screen" class="auth-overlay active">

        <h2>Toko AZARIYA</h2>
        <p>Silakan pilih akses masuk aplikasi:</p>

        <button class="admin-big-btn" style="margin: 15px 0 10px 0; font-size: 1rem; padding: 14px;" onclick="chooseRole('buyer')">

        </button>

        <button class="admin-big-btn" style="margin: 5px 0 0 0; font-size: 1rem; padding: 14px; background: linear-gradient(135deg, #34495e, #2c3e50);" onclick="chooseRole('admin')">
